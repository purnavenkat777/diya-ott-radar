
name: Diya OTT Radar

on:
  schedule:
    - cron: "30 2 * * 5"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send Telegram connection test only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Telegram
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --test

      - name: Send weekly OTT report
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.send_test) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_ITEMS: "20"
        run: python main.py
